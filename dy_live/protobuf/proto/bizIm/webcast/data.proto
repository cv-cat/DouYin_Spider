  optional string key = 1;
  optional string default_pattern = 2;
}

message TextPieceImage {
  optional Image image = 1;
  optional float scaling_rate = 2;
}

message TextPiece {
  optional int32 type = 1;
  optional TextFormat format = 2;
  optional string value_ref = 3;
  optional string string_value = 11;
  optional TextPieceUser user_value = 21;
  optional TextPieceGift gift_value = 22;
