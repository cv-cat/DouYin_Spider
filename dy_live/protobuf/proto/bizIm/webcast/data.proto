  optional TextPiecePatternRef pattern_ref_value = 24;
  optional TextPieceImage image_value = 25;
  optional string schema_key = 100;
  optional string light_interact_key = 101;
}

message Text {
  optional string key = 1;
  optional string default_pattern = 2;
  optional TextFormat default_format = 3;
  repeated TextPiece pieces = 4;
  map<string,SchemaInfo> schema_infos = 20;
  map<string,LightInteractData> light_interact_infos = 21;
}

message CombinedText {
  repeated DisplayItem display_items = 1;
  optional SchemaInfo schema_info = 10;
  optional ComboInfo combo_info = 11;
  map<string,CountdownConfig> countdown_configs = 12;
}

message CountdownConfig {
  repeated CountdownAction end_actions = 1;
}

message CountdownAction {
  optional int32 action_type = 1;
  optional int32 delay_ms = 2;
  optional string toast = 3;
  map<string,string> request_params = 4;
  optional ClickMobData track_mob = 5;
  optional CombinedText refresh_text = 6;
}

message DisplayItem {
  optional int32 display_item_type = 1;
  optional bool combo_fresh = 20;
  optional SchemaInfo schema_info = 21;
  optional AggregateInfo aggregate_info = 22;
  optional bool number_roll = 23;
  optional ImagesItem images_item = 50;
  optional TextItem text_item = 51;
  optional CountdownItem countdown_item = 52;
  optional DisplayItemFormat format = 100;
}

message CountdownItem {
  optional int32 duration_ms = 1;
  optional int32 format_type = 2;
  optional int32 update_interval = 3;
  optional int32 speed_ratio_x100 = 4;
  optional string countdown_config_key = 5;
  optional string color = 6;
  optional int32 weight = 7;
}

message DisplayItemFormat {
  optional bool enable_left_space = 1;
  optional int64 left_space = 2;
}

message ImagesItem {
  repeated Image images = 1;
  optional ImagesTag tag = 19;
  optional int32 display_style = 20;
}

message ImagesTag {
  optional string text = 1;
